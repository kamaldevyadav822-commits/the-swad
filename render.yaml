services:
  # Customer frontend
  - type: web
    name: the-swad-frontend
    runtime: static
    buildCommand: ""
    staticPublishPath: ./public
    autoDeploy: true

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # API / payment / Firebase server
  - type: web
    name: the-swad-api
    runtime: node
    rootDir: .
    buildCommand: npm ci
    startCommand: npm start
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000

      # Set this in Render after the frontend URL is created.
      - key: CLIENT_ORIGIN
        sync: false

      # Razorpay credentials — add as secret values in Render.
      - key: RAZORPAY_KEY_ID
        sync: false

      - key: RAZORPAY_KEY_SECRET
        sync: false

      # Firebase Admin service account JSON — secret.
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

      - key: FIREBASE_DATABASE_URL
        sync: false

    healthCheckPath: /api/health
    autoDeploy: true
