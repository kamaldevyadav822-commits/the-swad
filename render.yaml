services:
  - type: web
    name: the-swad
    runtime: node

    buildCommand: npm install
    startCommand: npm start

    healthCheckPath: /api/health

    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000

      - key: CLIENT_ORIGIN
        value: "*"

      - key: RAZORPAY_KEY_ID
        sync: false

      - key: RAZORPAY_KEY_SECRET
        sync: false

      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

      - key: FIREBASE_DATABASE_URL
        sync: false